name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  SDL_TAG: release-3.2.30

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B dist

      - uses: actions/upload-artifact@v4
        with:
          name: internet-${{ matrix.name }}
          path: dist/Internet-*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch SDL
        run: git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git android/SDL

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: internet-android
          path: android/app/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=

      - name: Build
        run: cmake --build build-ios --config Release

      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build-ios/Release-iphoneos/Internet.app dist/Payload/
          cd dist
          zip -qr Internet-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: internet-ios
          path: dist/Internet-unsigned.ipa
